name: Build Windows

on:
  push:
    branches: [main, custom]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Wallplayer | Out-Null
          Copy-Item src-tauri/target/release/wallplayer.exe dist/Wallplayer/Wallplayer.exe
          $dll = Get-ChildItem src-tauri/target/release -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist/Wallplayer/ }
          (Get-Content HUONG-DAN.txt) | Set-Content -Encoding utf8 dist/Wallplayer/HUONG-DAN.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Wallplayer-Windows-x64
          path: dist/Wallplayer

      - name: Publish release (custom branch)
        if: github.ref == 'refs/heads/custom'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/Wallplayer -DestinationPath Wallplayer-Windows-x64.zip -Force
          $notes = "Bản build mới nhất của nhánh custom (commit ${{ github.sha }}). Tải Wallplayer-Windows-x64.zip, giải nén, mở Wallplayer.exe. Chi tiết trong HUONG-DAN.txt."
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest Wallplayer-Windows-x64.zip --title "Wallplayer - bản mới nhất (custom)" --notes $notes --target ${{ github.sha }} --latest
