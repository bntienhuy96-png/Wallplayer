<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallplayer · Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{--a:255,255,255;--b:255,255,255}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07070a;color:#fff;
  font-family:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;cursor:default}

/* album cover, blurred, as the base layer */
#bg{position:absolute;inset:-8%;background:#07070a center/cover no-repeat;filter:blur(70px) saturate(1.35) brightness(.5);
  transform:scale(1.15);opacity:0;transition:opacity 1.2s ease,background-image 1.2s ease}
#bg.on{opacity:1}

/* slow colour blobs in the album colours */
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:
    radial-gradient(45% 55% at var(--x1,25%) var(--y1,75%),rgba(var(--a),.55),transparent 70%),
    radial-gradient(40% 50% at var(--x2,75%) var(--y2,30%),rgba(var(--b),.45),transparent 70%);
  transition:background 1.5s ease}

/* music video, muted, covering the screen */
#vid{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#vid.on{opacity:1}
#vid iframe,#vid #yt{position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-width:177.78vh;min-height:100vh;
  transform:translate(-50%,-50%);border:0}

/* bottom shade for legibility */
#shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 38%),linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,0) 22%)}

#clock{position:absolute;top:4.5vh;right:4vw;text-align:right;font-weight:200;line-height:1;
  text-shadow:0 2px 24px rgba(0,0,0,.35);transition:all .8s ease}
#clock .t{font-size:clamp(40px,7vh,96px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#clock .d{margin-top:.6vh;font-size:clamp(12px,1.6vh,18px);font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
body.idle #clock{top:50%;right:50%;transform:translate(50%,-50%);text-align:center}
body.idle #clock .t{font-size:clamp(80px,22vh,260px);font-weight:100}

#lyric{position:absolute;left:8vw;right:8vw;bottom:19vh;text-align:center;font-weight:700;
  font-size:clamp(22px,4.2vh,54px);line-height:1.2;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.55);
  opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease}
#lyric.on{opacity:1;transform:none}

#np{position:absolute;left:4vw;bottom:5vh;display:flex;align-items:center;gap:20px;max-width:60vw;
  opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
#np.on{opacity:1;transform:none}
#art{width:clamp(64px,11vh,132px);height:clamp(64px,11vh,132px);border-radius:14px;object-fit:cover;flex:none;
  box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12);background:rgba(255,255,255,.06)}
#art.none{visibility:hidden}
#meta{min-width:0}
#title{font-size:clamp(18px,3vh,36px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{margin-top:4px;font-size:clamp(13px,1.9vh,22px);font-weight:500;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bars{display:flex;gap:3px;align-items:flex-end;height:14px;margin-top:10px}
#bars i{width:3px;height:100%;border-radius:2px;background:rgb(var(--a));transform-origin:bottom;transform:scaleY(.25);opacity:.9}
body.playing #bars i{animation:eq 1s ease-in-out infinite}
#bars i:nth-child(2){animation-delay:-.3s}#bars i:nth-child(3){animation-delay:-.6s}#bars i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
</style>
</head>
<body class="idle">
<div id="bg"></div>
<div id="glow"></div>
<div id="vid"><div id="yt"></div></div>
<div id="shade"></div>
<div id="clock"><div class="t">--:--</div><div class="d"></div></div>
<div id="lyric"></div>
<div id="np">
  <img id="art" class="none" alt="">
  <div id="meta"><div id="title"></div><div id="artist"></div><div id="bars"><i></i><i></i><i></i><i></i></div></div>
</div>

<script>
"use strict";
/* Mirror window: shown on every monitor except the main skin's.
   The main window broadcasts "mirror-state" twice a second; this page
   only displays it (the video here is always muted). */
const T = window.__TAURI__ || null;
const $ = s => document.querySelector(s);
const st = {title: '', artist: '', art: null, video: null, playing: false, lyric: ''};

/* clock */
function tick(){
  const d = new Date();
  $('#clock .t').textContent = d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  $('#clock .d').textContent = d.toLocaleDateString([], {weekday: 'long', day: 'numeric', month: 'long'});
}
tick(); setInterval(tick, 1000);

/* slow drifting colour blobs */
(function drift(){
  const t = performance.now() / 1000, r = document.documentElement.style;
  r.setProperty('--x1', (25 + 10 * Math.sin(t * .11)) + '%'); r.setProperty('--y1', (72 + 8 * Math.cos(t * .09)) + '%');
  r.setProperty('--x2', (74 + 9 * Math.cos(t * .1)) + '%'); r.setProperty('--y2', (30 + 9 * Math.sin(t * .13)) + '%');
  setTimeout(drift, 120);
})();

/* YouTube player (muted) */
let ytApi = null, yt = null, ytReady = null, curVid = null;
function loadYT(){
  if (ytApi) return ytApi;
  ytApi = new Promise(res => {
    if (window.YT && YT.Player) return res(true);
    window.onYouTubeIframeAPIReady = () => res(true);
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => res(false);
    document.head.appendChild(s); setTimeout(() => res(!!(window.YT && YT.Player)), 9000);
  });
  return ytApi;
}
async function ensureYT(){
  if (ytReady) return ytReady;
  if (!(await loadYT())) return false;
  ytReady = new Promise(res => {
    yt = new YT.Player('yt', {width: '100%', height: '100%',
      playerVars: {autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, mute: 1, origin: location.origin},
      events: {
        onReady: () => { try { yt.mute() } catch(e){} res(true) },
        onStateChange: e => { if (e.data === 1) $('#vid').classList.add('on') },
        onError: () => { $('#vid').classList.remove('on'); curVid = null }
      }});
  });
  return ytReady;
}
async function syncVideo(id, time, playing){
  if (!id){
    if (curVid){ curVid = null; $('#vid').classList.remove('on'); try { yt && yt.stopVideo() } catch(e){} }
    return;
  }
  if (!(await ensureYT())) return;
  try {
    if (id !== curVid){
      curVid = id; $('#vid').classList.remove('on');
      yt.loadVideoById({videoId: id, startSeconds: Math.max(0, time || 0)}); yt.mute();
      return;
    }
    const s = yt.getPlayerState();
    if (playing && s !== 1 && s !== 3) yt.playVideo();
    if (!playing && s === 1) yt.pauseVideo();
    const now = yt.getCurrentTime() || 0;
    if (time > 0 && Math.abs(now - time) > 1.5) yt.seekTo(time, true);
  } catch(e){}
}

/* apply a state from the main window */
function apply(m){
  if (!m) return;
  const has = !!(m.title || m.artist);
  document.body.classList.toggle('idle', !has);
  document.body.classList.toggle('playing', !!m.playing);
  $('#np').classList.toggle('on', has);
  if (m.title !== st.title || m.artist !== st.artist){
    st.title = m.title; st.artist = m.artist;
    $('#title').textContent = m.title || ''; $('#artist').textContent = m.artist || '';
  }
  if (m.artChanged){
    st.art = m.art || null;
    const img = $('#art');
    if (st.art){ img.src = st.art; img.classList.remove('none'); $('#bg').style.backgroundImage = `url("${st.art.replace(/"/g, '%22')}")`; $('#bg').classList.add('on') }
    else { img.removeAttribute('src'); img.classList.add('none'); $('#bg').classList.remove('on') }
  }
  if (m.accent){ const r = document.documentElement.style; r.setProperty('--a', m.accent.join(',')); r.setProperty('--b', (m.accent2 || m.accent).join(',')) }
  const ly = m.lyric || '';
  if (ly !== st.lyric){
    st.lyric = ly; const el = $('#lyric'); el.classList.remove('on');
    setTimeout(() => { el.textContent = st.lyric; if (st.lyric) el.classList.add('on') }, ly ? 180 : 0);
  }
  // compensate for the time the message spent in flight
  const lag = m.at ? Math.max(0, (Date.now() - m.at) / 1000) : 0;
  syncVideo(m.video || null, (m.time || 0) + (m.playing ? lag : 0), !!m.playing);
}

if (T){
  T.event.listen('mirror-state', e => apply(e.payload));
  T.event.emit('mirror-hello', {}).catch(() => {});
} else {
  // opened in a browser: show a sample
  apply({title: 'Not connected', artist: 'Open from Wallplayer', artChanged: true, art: null, accent: [140, 110, 255], accent2: [255, 90, 170], playing: true, lyric: ''});
}
</script>
</body>
</html>
